plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'com.gradleup.shadow' version '9.6.1'
	id 'maven-publish'
}

version = "3-proof"

repositories {
	maven { url = 'https://maven.fabricmc.net/' }
	mavenCentral()
	maven { url = 'https://api.modrinth.com/maven' }
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"fundo" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

 
 
configurations {
	fundoShadow {
		canBeConsumed = false
		canBeResolved = true
	}
}

dependencies {

	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	 
	 
	compileOnly "maven.modrinth:midnightlib:wJeXgIoa"
	include "maven.modrinth:midnightlib:wJeXgIoa"
	localRuntime "maven.modrinth:midnightlib:wJeXgIoa"

	 
	 
	compileOnly "maven.modrinth:u6dRKJwZ:CkeVHO6P"
	compileOnly "maven.modrinth:mOgUt4GM:9DznhFoj"

	 
	localRuntime "maven.modrinth:u6dRKJwZ:CkeVHO6P"
	localRuntime "maven.modrinth:7tEfOcA7:k9NIYAoR"
	localRuntime "maven.modrinth:mOgUt4GM:9DznhFoj"
	localRuntime "maven.modrinth:eXts2L7r:lXytLqWj"
	localRuntime "maven.modrinth:P9vIqP8R:HpEXV64p"
	localRuntime "maven.modrinth:7vxePowz:hTNvMewX"
	localRuntime "maven.modrinth:kp31625Q:1MyBcOQa"	 
}

base {
	archivesName = "fundo"
}

 
 
def fundoJarName = { proj -> "${proj.base.archivesName.get()}_${proj.version}+263.jar" }

 
 
tasks.named('jar') {
	archiveFileName.set(fundoJarName(project).replace('.jar', '-dev.jar'))
}

def fundoResourceRoots = [file("src/main/resources"), file("src/client/resources")]
def repairNegativeResourceTimestamps = {
	fundoResourceRoots.findAll { it.exists() }.each { root ->
		fileTree(root).visit { details ->
			File resource = details.file
			if (resource.lastModified() < 0L && !resource.setLastModified(0L)) {
				throw new GradleException("Could not repair negative timestamp for ${resource}")
			}
		}
	}
}
tasks.matching { it.name in ["processResources", "processClientResources"] }.configureEach {
	doFirst(repairNegativeResourceTimestamps)
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {

	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("License") {
		rename { "${it}_$projectName"}
	}
}

 
 
 
 
tasks.named('shadowJar') {
	dependsOn tasks.named('jar')
	rootSpec.children.clear()
	rootSpec.from {
		zipTree(tasks.named('jar').get().archiveFile.get().asFile)
	}
	configurations = [project.configurations.fundoShadow]
	archiveClassifier.set('')
	archiveFileName.set(fundoJarName(project))
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {

	}
}
